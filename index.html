<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broasted Chicken King</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Latar: merah + lukisan ayam (bg-red.webp), sandaran merah jika gambar tiada */
    body{background:#dc1f26 url('bg-red.webp') center top/cover fixed no-repeat}
    .banner-wrap{background:linear-gradient(135deg,#fde047,#f59e0b)}
    /* Animasi */
    @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.9) rotate(8deg)}100%{transform:scale(1)}}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(.94)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
    @keyframes rowin{0%{background:#fde047;transform:translateX(24px);opacity:0}100%{background:transparent;transform:none;opacity:1}}
    @keyframes toastin{0%{transform:translate(-50%,30px);opacity:0}15%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-10px);opacity:0}}
    @keyframes boxin{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
    @keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
    .bump{animation:bump .5s ease}
    .pop{animation:pop .35s ease}
    .row-in{animation:rowin .6s ease}
    .box-in{animation:boxin .4s ease}
    #toast{position:fixed;left:50%;bottom:24px;z-index:120;pointer-events:none;opacity:0}
    #toast.show{animation:toastin 1.8s ease forwards}
    .spark{position:fixed;z-index:110;pointer-events:none;font-size:18px;animation:burst .7s ease-out forwards}
    @media (prefers-reduced-motion:reduce){.bump,.pop,.row-in,.box-in,#toast.show,.spark{animation:none!important}#toast.show{opacity:1}}
  </style>
</head>
<body class="font-sans min-h-screen pb-20 text-gray-900">

  <header class="bg-red-800/95 border-b-4 border-yellow-400 text-white p-3 shadow-lg sticky top-0 z-50 backdrop-blur">

      <h1 class="text-xl sm:text-2xl font-black italic text-yellow-300">👑 Broasted Chicken <span class="text-white">King</span></h1>
      <div class="flex items-center gap-3">
        <div id="langs" class="flex rounded-full overflow-hidden border-2 border-yellow-400 text-xs font-bold"></div>
        <a href="#cart" class="relative text-2xl" id="cart-icon">🛒<span id="cart-count" class="absolute -top-2 -right-3 bg-yellow-400 text-red-800 font-bold text-xs px-2 py-0.5 rounded-full">0</span></a>

      </div>

      <div class="border-t-2 border-yellow-400 mt-4 pt-3 space-y-2">

          <span data-t="total"></span><span id="cart-total">RM 0.00</span>
        </div>
        <div class="space-y-2 pt-2 text-sm">
          <input id="c-name" type="text" data-p="name" class="w-full border rounded-lg p-2">

            <label class="flex items-center gap-1"><input type="radio" name="mode" value="Dine In" onchange="toggleMode()"> <span data-t="dine"></span></label>

          <div id="pickup-box">

            <input id="c-time" type="time" dir="ltr" class="w-full border rounded-lg p-2">
          </div>
          <div id="dine-box" class="hidden">
            <label class="block text-xs text-gray-600 mb-1" data-t="pax"></label>
            <input id="c-pax" type="number" min="1" max="50" dir="ltr" data-p="paxPh" class="w-full border rounded-lg p-2">

            <option value="QR" data-t="qr"></option>

          <button id="send-btn" onclick="submitOrder()" class="w-full bg-red-600 hover:bg-red-700 text-yellow-300 font-black py-3 rounded-full text-center mt-2 transition shadow" data-t="send"></button>
          <div id="done-box" class="hidden bg-green-50 border border-green-400 rounded-lg p-3 text-sm text-green-900"></div>
        </div>
      </div>
    </section>

              <input id="n-${id}" type="text" maxlength="120" placeholder="${esc(t.inote)}" class="border rounded-lg px-2 py-2 text-sm w-full">
              <div class="flex flex-wrap justify-between items-center gap-2 mt-1">
                <span id="price-${id}" class="bg-yellow-300 text-red-700 font-black text-lg px-3 py-0.5 rounded-full"></span>
                <div class="flex items-center gap-2">
                  <div class="flex items-center border-2 border-red-700 rounded-full overflow-hidden" dir="ltr" aria-label="${esc(t.qtyL)}">
                    <button type="button" onclick="stepQty('${id}',-1)" class="w-8 h-9 font-black text-red-700 hover:bg-yellow-200 active:bg-yellow-300" aria-label="-">−</button>
                    <input id="q-${id}" type="number" inputmode="numeric" min="1" max="${MAX_QTY}" value="1" onchange="stepQty('${id}',0)" class="w-10 h-9 text-center font-black text-red-700 outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none">
                    <button type="button" onclick="stepQty('${id}',1)" class="w-8 h-9 font-black text-red-700 hover:bg-yellow-200 active:bg-yellow-300" aria-label="+">+</button>
                  </div>
                  <button id="add-${id}" onclick="addFromMenu(${ci},${ii})" class="bg-red-600 hover:bg-red-700 text-yellow-300 font-black px-5 py-2 rounded-full text-sm transition shadow">${t.add}</button>
                </div>
              </div>
            </div>
          </div>`; }).join('')}`).join('');
      M.forEach((cat, ci) => cat.items.forEach((_, ii) => refreshCard(ci, ii)));
    }

    function stepQty(id, d) {
      const el = $(`q-${id}`); let v = (parseInt(el.value, 10) || 1) + d;
      el.value = Math.min(MAX_QTY, Math.max(1, v));
    }

    function refreshCard(ci, ii) {
      const t = T[lang], id = `${ci}-${ii}`, o = M[ci].items[ii].o[$(`o-${id}`).value];
      const dEl = $(`d-${id}`); let info = '';
      if (o.i) info += `<b>${t.incl}</b> ${esc(incText(o.i, lang))}`;
      if (o.drink === 'choose') { dEl.classList.remove('hidden'); info += `${info ? '<br>' : ''}<b>${t.air}</b> ${t.chooseAbove}`; }
      else { dEl.classList.add('hidden'); dEl.value = ''; if (o.drink) info += `${info ? '<br>' : ''}<b>${t.air}</b> ${t.pepsiL}`; }
      const bw = $(`bw-${id}`); bw.classList.toggle('hidden', !hasBread(o)); bw.classList.toggle('flex', hasBread(o));
      $(`inc-${id}`).innerHTML = info; $(`inc-${id}`).classList.toggle('hidden', !info);
      $(`price-${id}`).innerText = `RM ${o.price.toFixed(2)}`;
    }

    // ---------- Animasi ----------
    function replay(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
    function showToast(msg) { const t = $('toast'); t.textContent = msg; replay(t, 'show'); }
    function sparkle(x, y) {
      if (reduceMotion) return;
      ['✨','🍗','⭐','✨','🔥'].forEach((s, i) => {
        const a = (i / 5) * Math.PI * 2, d = 40 + Math.random() * 25, e = document.createElement('span');
        e.className = 'spark'; e.textContent = s; e.style.left = x + 'px'; e.style.top = y + 'px';
        e.style.setProperty('--x', Math.cos(a) * d + 'px'); e.style.setProperty('--y', Math.sin(a) * d + 'px');
        document.body.appendChild(e); setTimeout(() => e.remove(), 750);
      });
    }
    function flyToCart(btn, emoji) {
      const cartEl = $('cart-icon'), a = btn.getBoundingClientRect(), b = cartEl.getBoundingClientRect();
      const done = () => { replay(cartEl, 'bump'); replay($('cart-count'), 'bump'); };
      replay(btn, 'pop'); sparkle(a.left + a.width / 2, a.top + a.height / 2);
      if (reduceMotion || !document.body.animate) { done(); return; }
      const el = document.createElement('div'); el.textContent = emoji;
      el.style.cssText = `position:fixed;left:${a.left + a.width / 2 - 16}px;top:${a.top}px;font-size:32px;z-index:130;pointer-events:none`;
      document.body.appendChild(el);
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - a.top;
      el.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:`translate(${dx * 0.45}px,${Math.min(dy, 0) - 90}px) scale(1.5)`, opacity:1, offset:.4 },
        { transform:`translate(${dx}px,${dy}px) scale(.3)`, opacity:.5 }
      ], { duration:850, easing:'cubic-bezier(.45,0,.75,.55)' }).onfinish = () => { el.remove(); done(); };
    }

    function addFromMenu(ci, ii) {
      const t = T[lang], it = M[ci].items[ii], id = `${ci}-${ii}`, o = it.o[$(`o-${id}`).value], det = [];
      const qty = Math.min(MAX_QTY, Math.max(1, parseInt($(`q-${id}`).value, 10) || 1));
      if (it.o.length > 1) det.push({ k:'opt', v:o.k });
      if (it.parts) { const p = $(`p-${id}`).value; if (p === '') { alert(t.aPart); return; } det.push({ k:'part', v:+p }); }
      if (hasBread(o)) det.push({ k:'bread', v:+$(`b-${id}`).value });
      if (o.drink === 'choose') { const d = $(`d-${id}`).value; if (d === '') { alert(t.aDrink); return; } det.push({ k:'drink', v:+d }); }
      else if (o.drink) det.push({ k:'drink', v:'L' });
      const note = $(`n-${id}`).value.trim(); if (note) det.push({ k:'note', v:note });
      const key = id + JSON.stringify(det), ex = cart.find(c => c.key === key);
      if (ex) ex.qty = Math.min(MAX_QTY, ex.qty + qty); else cart.push({ key, ci, ii, price:o.price, details:det, qty });
      lastAdded = key;
      $(`n-${id}`).value = ''; $(`q-${id}`).value = 1; updateCartUI();
      flyToCart($(`add-${id}`), M[ci].e);
      showToast(`✔ ${nm(it)} x${qty} ${t.added}`);
    }

    // ---------- Troli ----------
    let cart = [], lastAdded = null;
    function changeQty(idx, d) {
      const c = cart[idx]; if (!c) return;
      c.qty += d; if (c.qty <= 0) cart.splice(idx, 1); else c.qty = Math.min(MAX_QTY, c.qty);
      lastAdded = null; updateCartUI();
    }
    function updateCartUI() {
      const box = $('cart-items'); let total = 0, count = 0, html = cart.length ? '' : `<p class="text-gray-500 italic">${T[lang].empty}</p>`;
      cart.forEach((c, idx) => {
        const it = M[c.ci].items[c.ii], sub = c.price * c.qty; total += sub; count += c.qty;
        html += `<div class="${c.key === lastAdded ? 'row-in ' : ''}flex justify-between items-start border-b pb-1 gap-2 rounded">
          <div class="min-w-0"><p class="font-bold text-gray-800">${esc(nm(it))}</p>
            ${c.details.map(d => `<p class="text-xs text-gray-600">${esc(detailText(d, lang))}</p>`).join('')}
            <div class="flex items-center gap-2 mt-1" dir="ltr">
              <button onclick="changeQty(${idx},-1)" class="w-6 h-6 rounded-full border-2 border-red-700 text-red-700 font-black leading-none">−</button>
              <span class="font-black w-5 text-center">${c.qty}</span>
              <button onclick="changeQty(${idx},1)" class="w-6 h-6 rounded-full border-2 border-red-700 text-red-700 font-black leading-none">+</button>
              <span class="text-xs text-gray-500">RM ${c.price.toFixed(2)} x ${c.qty}</span>
            </div></div>
          <div class="flex items-center gap-2"><span class="font-semibold">RM ${sub.toFixed(2)}</span>
            <button onclick="cart.splice(${idx},1);lastAdded=null;updateCartUI()" class="text-red-500 font-bold px-1">✕</button></div></div>`;
      });
      box.innerHTML = html; lastAdded = null;
      $('cart-count').innerText = count; $('cart-total').innerText = `RM ${total.toFixed(2)}`;
    }

    function toggleMode() {
      const dine = document.querySelector('input[name="mode"]:checked').value === 'Dine In';
      $('pickup-box').classList.toggle('hidden', dine); $('dine-box').classList.toggle('hidden', !dine);
    }
    function togglePay() {
      $('pay-info').innerHTML = $('pay-method').value === 'QR'
        ? `<img src="${esc(QR_IMAGE)}" alt="QR" class="w-52 max-w-full mx-auto rounded border">` : esc(BANK_INFO).replace(/\n/g, '<br>');
    }

    function saveOrder(order) {
      if (ORDERS_API) {
        fetch(ORDERS_API, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ action:'add', order }) }).catch(() => {});
      } else {
        try { const a = JSON.parse(localStorage.getItem('orders') || '[]'); a.push(order); localStorage.setItem('orders', JSON.stringify(a)); } catch (e) {}
      }
    }

    function submitOrder() {
      const t = T[lang];
      if (!cart.length) { alert(t.aEmpty); return; }
      const name = $('c-name').value.trim(), phone = $('c-phone').value.replace(/\D/g, '');
      if (!name) { alert(t.aName); return; }
      if (phone.length < 9) { alert(t.aPhone); return; }
      const mode = document.querySelector('input[name="mode"]:checked').value; let info;
      if (mode === 'Pickup') { const tm = $('c-time').value; if (!tm) { alert(t.aTime); return; } info = `Pickup time: ${tm}`; }
      else { const px = parseInt($('c-pax').value, 10); if (!px || px < 1) { alert(t.aPax); return; } info = `Diners: ${px}`; }

      const pi = $('pay-method').value === 'QR' ? 1 : 0, payment = T.en.payT[pi];
      const orderNo = phone.slice(-4), note = $('order-note').value.trim();
      // Mesej & rekod untuk kedai: semuanya dalam Bahasa Inggeris
      const items = cart.map(c => ({ name: M[c.ci].items[c.ii].n, qty: c.qty, price: c.price, details: c.details.map(d => detailText(d, 'en')) }));
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);
      let msg = `Hi, I would like to place an order.\n*Order No: ${orderNo}*\nName: ${name}\nPhone: ${phone}\nType: ${mode} (${info})\nPayment: ${payment}\n\n`;
      items.forEach(i => { msg += `- ${i.name} x${i.qty} = RM ${(i.price * i.qty).toFixed(2)}\n`; i.details.forEach(d => msg += `   ${d}\n`); });
      msg += `\n*Total: RM ${total.toFixed(2)}*`; if (note) msg += `\nNote: ${note}`; msg += `\n\nI will send the proof of payment.`;

      saveOrder({ orderNo, name, phone, mode, info, payment, note, total, items, status:'Menunggu bayaran', time:new Date().toISOString() });
      const done = $('done-box');
      done.classList.remove('hidden'); done.innerHTML = t.done(orderNo, total.toFixed(2), t.payT[pi]); replay(done, 'box-in');
      const sb = $('send-btn').getBoundingClientRect(); replay($('send-btn'), 'pop'); sparkle(sb.left + sb.width / 2, sb.top + sb.height / 2);
      window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
      cart = []; updateCartUI();
    }

    toggleMode(); togglePay(); setLang(lang);
  </script>
</body>
</html>
