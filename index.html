<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu & Shopping Cart Makanan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-20">

  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <h1 class="text-xl font-bold">Broasted Chicken King</h1>
    <div class="relative">
      <span class="text-2xl">🛒</span>
      <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-red-900 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">

    <!-- Senarai menu dijana oleh JavaScript daripada data di bawah -->
    <section id="menu" class="md:col-span-2 space-y-4"></section>

    <section class="bg-white p-4 rounded-lg shadow-md border h-fit sticky top-20">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-3">Troli Pesanan</h2>
      <div id="cart-items" class="space-y-2 text-sm max-h-60 overflow-y-auto">
        <p class="text-gray-500 italic">Troli anda masih kosong.</p>
      </div>
      <div class="border-t mt-4 pt-3 space-y-2">
        <div class="flex justify-between font-bold text-base text-gray-900">
          <span>Jumlah Keseluruhan:</span>
          <span id="cart-total">RM 0.00</span>
        </div>
        <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-center mt-2 transition">
          Hantar Pesanan (WhatsApp)
        </button>
      </div>
    </section>

  </main>

  <p class="text-center text-xs text-gray-500 mt-6">Harga termasuk 6% SST</p>

  <script>
    // ============================================================
    // DATA MENU - EDIT DI SINI SAHAJA
    // image: letak pautan atau nama fail (cth "fillet.jpg"). Kosongkan jika belum ada.
    // options: label + harga. Kalau satu harga sahaja, letak satu pilihan.
    // ============================================================
    const SET = "Set (dengan minuman)";
    const NODRINK = "Tanpa minuman";
    const ALC = "A la carte";

    const chickenImg = "https://images.unsplash.com/photo-1562967914-608f82629710?w=500&auto=format&fit=crop";

    const menu = [
      { category: "Broasted Chicken", items: [
        { name: "Broasted Chicken - Suku (2 pcs)", desc: "Broasted chicken suku.", image: chickenImg,
          options: [{label: SET, price: 18.00}, {label: NODRINK, price: 16.50}, {label: ALC, price: 13.50}] },
        { name: "Broasted Chicken - Separuh (4 pcs)", desc: "Broasted chicken separuh.", image: chickenImg,
          options: [{label: SET, price: 26.50}, {label: NODRINK, price: 25.00}, {label: ALC, price: 22.00}] },
        { name: "Broasted Chicken - Penuh (8 pcs)", desc: "Broasted chicken penuh.", image: chickenImg,
          options: [{label: SET, price: 51.00}, {label: NODRINK, price: 46.50}, {label: ALC, price: 41.00}] },
      ]},
      { category: "Chicken Fillet", items: [
        { name: "Chicken Fillet (3 pcs)", desc: "Chicken fillet 3 keping.", image: "",
          options: [{label: SET, price: 16.00}, {label: NODRINK, price: 14.50}, {label: ALC, price: 10.50}] },
        { name: "Chicken Fillet (5 pcs)", desc: "Chicken fillet 5 keping.", image: "",
          options: [{label: SET, price: 21.00}, {label: NODRINK, price: 19.50}, {label: ALC, price: 17.00}] },
      ]},
      { category: "Fried Rolls", items: [
        { name: "Pizza Roll", desc: "Fried roll pizza.", image: "", options: [{label: "Harga", price: 10.00}] },
        { name: "Crispy Roll", desc: "Fried roll rangup.", image: "", options: [{label: "Harga", price: 9.00}] },
      ]},
      { category: "Cheesy Fries & Chicken", items: [
        { name: "Cheesy Fries & Chicken - Kecil", desc: "Kentang goreng cheese dengan ayam.", image: "", options: [{label: "Harga", price: 10.00}] },
        { name: "Cheesy Fries & Chicken - Besar", desc: "Kentang goreng cheese dengan ayam.", image: "", options: [{label: "Harga", price: 18.00}] },
      ]},
      { category: "Burger", items: [
        { name: "BCK Burger", desc: "Burger ayam BCK.", image: "",
          options: [{label: "Set", price: 14.50}, {label: ALC, price: 10.00}] },
        { name: "Fillet Burger", desc: "Burger fillet ayam.", image: "",
          options: [{label: "Set", price: 14.50}, {label: ALC, price: 10.00}] },
        { name: "Shrimp Burger", desc: "Burger udang.", image: "",
          options: [{label: "Set", price: 17.00}, {label: ALC, price: 12.50}] },
      ]},
      { category: "Shrimp", items: [
        { name: "Shrimp", desc: "Udang goreng.", image: "",
          options: [{label: SET, price: 31.00}, {label: NODRINK, price: 29.50}, {label: ALC, price: 25.50}] },
      ]},
      { category: "Fish", items: [
        { name: "Fish (1 pcs)", desc: "Ikan goreng 1 keping.", image: "",
          options: [{label: SET, price: 16.50}, {label: NODRINK, price: 15.00}, {label: ALC, price: 10.50}] },
        { name: "Fish (2 pcs)", desc: "Ikan goreng 2 keping.", image: "",
          options: [{label: SET, price: 24.00}, {label: NODRINK, price: 22.00}, {label: ALC, price: 19.00}] },
      ]},
      { category: "Sandwich", items: [
        { name: "Sandwich Chicken", desc: "Sandwich ayam.", image: "",
          options: [{label: "Set", price: 16.00}, {label: ALC, price: 10.00}] },
        { name: "Sandwich Fish", desc: "Sandwich ikan.", image: "",
          options: [{label: "Set", price: 16.50}, {label: ALC, price: 11.50}] },
        { name: "Sandwich Shrimp", desc: "Sandwich udang.", image: "",
          options: [{label: "Set", price: 17.50}, {label: ALC, price: 12.50}] },
      ]},
    ];

    // Tukar nombor WhatsApp di sini (format 601xxxxxxxx)
    const PHONE = "60129444916";

    // ---------- Paparkan menu ----------
    const menuEl = document.getElementById('menu');
    menu.forEach((cat, ci) => {
      let html = `<h2 class="text-lg font-bold text-gray-800 border-b pb-2 pt-2">${cat.category}</h2>`;
      cat.items.forEach((item, ii) => {
        const img = item.image
          ? `<img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">`
          : `<div class="w-full h-full flex items-center justify-center text-5xl">🍗</div>`;
        const opts = item.options.map((o, oi) =>
          `<option value="${oi}">${o.label} - RM ${o.price.toFixed(2)}</option>`).join('');
        html += `
        <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col sm:flex-row p-3 gap-4 border">
          <div class="w-full sm:w-36 h-36 bg-gray-200 rounded-md overflow-hidden flex-shrink-0">${img}</div>
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-900 text-lg">${item.name}</h3>
              <p class="text-sm text-gray-600 mt-1">${item.desc}</p>
            </div>
            <div class="flex flex-wrap justify-between items-center gap-2 mt-3">
              <select id="opt-${ci}-${ii}" class="border rounded-lg px-2 py-2 text-sm text-gray-800">${opts}</select>
              <button onclick="addFromMenu(${ci}, ${ii})" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">+ Tambah</button>
            </div>
          </div>
        </div>`;
      });
      menuEl.insertAdjacentHTML('beforeend', html);
    });

    function addFromMenu(ci, ii) {
      const item = menu[ci].items[ii];
      const opt = item.options[document.getElementById(`opt-${ci}-${ii}`).value];
      const name = item.options.length > 1 || opt.label !== "Harga"
        ? `${item.name} [${opt.label}]` : item.name;
      addToCart(name, opt.price);
    }

    // ---------- Troli ----------
    let cart = [];

    function addToCart(name, price) {
      const existing = cart.find(i => i.name === name);
      if (existing) existing.qty += 1; else cart.push({ name, price, qty: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      const box = document.getElementById('cart-items');
      if (cart.length === 0) {
        box.innerHTML = '<p class="text-gray-500 italic">Troli anda masih kosong.</p>';
        document.getElementById('cart-count').innerText = '0';
        document.getElementById('cart-total').innerText = 'RM 0.00';
        return;
      }
      let total = 0, count = 0;
      box.innerHTML = '';
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal; count += item.qty;
        box.innerHTML += `
          <div class="flex justify-between items-center border-b pb-1">
            <div>
              <p class="font-medium text-gray-800">${item.name}</p>
              <p class="text-xs text-gray-500">RM ${item.price.toFixed(2)} x ${item.qty}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-semibold text-gray-700">RM ${itemTotal.toFixed(2)}</span>
              <button onclick="removeItem(${index})" class="text-red-500 font-bold px-1">✕</button>
            </div>
          </div>`;
      });
      document.getElementById('cart-count').innerText = count;
      document.getElementById('cart-total').innerText = `RM ${total.toFixed(2)}`;
    }

    function removeItem(index) { cart.splice(index, 1); updateCartUI(); }

    function checkoutWhatsApp() {
      if (cart.length === 0) { alert("Troli anda kosong!"); return; }
      let message = "Salam, saya nak buat pesanan makanan:\n\n";
      let total = 0;
      cart.forEach(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        message += `- ${item.name} x${item.qty} = RM ${subtotal.toFixed(2)}\n`;
      });
      message += `\n*Jumlah Keseluruhan: RM ${total.toFixed(2)}*`;
      window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(message)}`, '_blank');
    }
  </script>
</body>
</html>
